[project]
name = "geonex-sih"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.100.0",
	"uvicorn>=0.22.0",
	"torch>=2.0.0",
	"torchvision>=0.15.0",
	"numpy>=1.24.0",
	"opencv-python>=4.7.0.72",
	"pillow>=9.5.0",
	"shapely>=2.0.0",
